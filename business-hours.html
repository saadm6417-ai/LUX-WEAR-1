<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080605"><title>LUX WEAR | مواعيد العمل</title>
<style>
:root{--bg:#100d0c;--panel:#1b1512;--panel2:#241a16;--rose:#c8957d;--rose-light:#e0b59d;--rose-dark:#9f705c;--white:#f2e6dc;--muted:#b7a398;--line:#594237;--green:#00f06a;--red:#ff2638;--amber:#ffc04d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090807;color:var(--white);font-family:Tahoma,Arial,sans-serif}body{display:flex;justify-content:center;align-items:flex-start}
#hours{width:min(100vw,736px);aspect-ratio:736/1536;position:relative;overflow:hidden;isolation:isolate;container-type:inline-size;background-color:#0d0b0a;background-image:radial-gradient(ellipse at 50% 0%,#3a2923 0,#1a1310 28%,#0d0b0a 66%);background-size:cover;background-position:center;background-repeat:no-repeat}#hours:before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.22;background:linear-gradient(125deg,transparent 0 47%,#b77e6320 48%,transparent 49% 100%)}
#hours .language{position:absolute;right:3.1%;top:1.7%;z-index:2;border:1.4px solid var(--rose);border-radius:999px;background:#100d0cb8;color:var(--rose-light);font-size:1.8cqw;font-weight:bold;padding:1.05cqw 2.2cqw;min-width:16%;cursor:pointer}
#hours .logo{position:absolute;top:7.05%;left:50%;transform:translateX(-50%);width:28.1%;height:auto;filter:drop-shadow(0 0 6px #c8957d30)}
#hours .main-status{position:absolute;top:19.1%;left:5.8%;width:88.4%;min-height:7.8%;display:grid;place-items:center;text-align:center;padding:1.2cqw 3cqw;border:1.6px solid var(--green);border-radius:2.5cqw;background:#082817d9;box-shadow:0 0 1.8cqw #19df6530;color:#75ffa0;font-size:3.65cqw;font-weight:bold;line-height:1.5}
#hours .main-status.closed{border-color:var(--red);background:#4a080feF;box-shadow:0 0 2.8cqw #ff2638a6;color:#ffd0d4}
#hours .heading{position:absolute;top:27.3%;left:5.8%;width:88.4%;height:9.2%;display:flex;align-items:center;justify-content:center;gap:2.5cqw;border:1.5px solid var(--rose);border-radius:3cqw;padding:1cqw;background:#1b1512dc;box-shadow:0 0 2cqw #d98b6a35}
#hours .clock{font-size:8cqw;color:var(--rose-light);line-height:1}#hours h1{font-size:5.8cqw;margin:0;font-weight:700}#hours .english{direction:ltr;letter-spacing:.55cqw;color:#e0b59d;font-size:2.1cqw;margin-top:.6cqw;text-align:center}
#hours .days{position:absolute;top:39%;left:5.8%;width:88.4%;display:grid;gap:1.25cqw}
#hours .day{height:10.8cqw;min-height:0;display:grid;grid-template-columns:1fr 1.55fr auto;align-items:center;gap:1cqw;padding:0 2.2cqw;border:1.4px solid #c8957d;border-radius:2.2cqw;background:#100d0ce8}
#hours .day.today{border:2.2px solid var(--green);box-shadow:0 0 2.5cqw #00f06a9c,inset 0 0 1.2cqw #00f06a18}#hours .day.today.closed-day{border-color:var(--red);box-shadow:0 0 2.8cqw #ff2638c9,inset 0 0 1.3cqw #ff263826}
#hours .name{font-size:4.15cqw;font-weight:bold;white-space:nowrap}#hours .time{direction:ltr;text-align:center;white-space:nowrap;font-size:3.55cqw}
#hours .status{border:1.5px solid var(--green);border-radius:25px;padding:1.25cqw 1.9cqw;background:#063d20;color:#8dffb3;font-size:2.7cqw;font-weight:bold;white-space:nowrap;text-align:center;box-shadow:0 0 1.2cqw #00f06a55}#hours .status.closed{border-color:var(--red);background:#5a080f;color:#ffd0d4;box-shadow:0 0 1.4cqw #ff263880}#hours .status.soon{border-color:var(--amber);background:#382407;color:#ffdb83}#hours .hidden-status{visibility:hidden}
#hours .footer{position:absolute;top:83.5%;left:0;width:100%;text-align:center}#hours .ornament{display:flex;align-items:center;gap:2cqw;width:65%;margin:0 auto .65cqw;color:#e0b59d;font-size:3.5cqw}#hours .ornament:before,#hours .ornament:after{content:"";height:.28cqw;flex:1;background:linear-gradient(90deg,transparent,var(--rose-light))}#hours .ornament:after{transform:scaleX(-1)}#hours .footer strong{font:bold 7.3cqw Georgia,serif;color:#e0b59d;letter-spacing:.5cqw}#hours .footer p{font-size:2.7cqw;margin:.8cqw;color:#f2e6dc}
@media(max-width:420px){#hours .day{grid-template-columns:1fr 1.45fr auto;gap:.7cqw;padding:0 1.7cqw}#hours .name{font-size:3.65cqw}#hours .time{font-size:3.05cqw}#hours .status{font-size:2.45cqw;padding:1.05cqw 1.5cqw}}
</style></head><body><main id="hours">

<script>(()=>{
let weeklyHours={0:{open:720,close:30},1:{open:720,close:30},2:{open:720,close:30},3:{open:720,close:30},4:{open:720,close:30},5:{open:780,close:90},6:{open:720,close:30}};
function toMinutes(t){if(!t)return 0;const [h,m]=t.split(':').map(Number);return h*60+m;}
async function loadStoreHours(){const db=window.luxwearSupabase;if(!db)return;try{const {data,error}=await db.from('store_hours').select('day_of_week,is_closed,open_time,close_time');if(error||!Array.isArray(data)||data.length!==7){console.warn('Could not load store hours; using page defaults.',error);return;}const next={};for(const r of data){const day=Number(r.day_of_week);if(!Number.isInteger(day)||day<0||day>6||next[day]){console.warn('Invalid or duplicate weekday in store_hours.');return;}if(r.is_closed){next[day]={closed:true,open:0,close:0};continue;}const open=toMinutes(r.open_time),close=toMinutes(r.close_time);if(!Number.isFinite(open)||!Number.isFinite(close)||open<0||open>=1440||close<0||close>=1440){console.warn('Invalid time in store_hours.');return;}next[day]={open,close};}if(Object.keys(next).length!==7)return;weeklyHours=next;renderLanguage();}catch(e){console.warn('Could not load store hours; using page defaults.',e);}}
let lang='ar';const cards=[...document.querySelectorAll('.day')],mainStatus=document.getElementById('mainStatus');
const words={ar:{title:'مواعيد العمل',open:'المتجر مفتوح الآن، أهلاً وسهلاً بك ♥️',closed:'المتجر مغلق الآن، في انتظارك غداً يا صديقي ♥️',isClosed:'مغلق',isOpen:'مفتوح',closing:'يغلق عند',thanks:'شكراً لاختيارك',tagline:'نسعد بخدمتك دائماً'},en:{title:'Business Hours',open:'We are open now. Welcome! ♥️',closed:'We are currently closed. See you tomorrow! ♥️',isClosed:'Closed',isOpen:'Open',closing:'Closes at',thanks:'Thank you for choosing us',tagline:'We are always happy to serve you'}};
function formatTime(total){const n=((total%1440)+1440)%1440,h=Math.floor(n/60),m=n%60,suffix=h<12?(lang==='ar'?'صباحًا':'AM'):(lang==='ar'?'مساءً':'PM');return `${h%12||12}:${String(m).padStart(2,'0')} ${suffix}`}
function renderLanguage(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('language').textContent='English';document.getElementById('headingTitle').textContent=words[lang].title;document.getElementById('thanks').textContent=words[lang].thanks;document.getElementById('tagline').textContent=words[lang].tagline;cards.forEach(c=>{const n=c.querySelector('.name');n.textContent=n.dataset[lang];const day=Number(c.dataset.day),hours=weeklyHours[day];c.querySelector('.time').textContent=hours.closed?(lang==='ar'?'مغلق':'Closed'):`\u2066${formatTime(hours.open)}\u2069 - \u2066${formatTime(hours.close)}\u2069`});updateStatus()}
function updateStatus(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Africa/Cairo',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const get=t=>parts.find(x=>x.type===t)?.value;const weekday=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(get('weekday'));const today=weekday<0?new Date().getDay():weekday,minute=Number(get('hour'))*60+Number(get('minute')),prev=(today+6)%7;let open=false,until=0;if(!weeklyHours[today].closed&&minute>=weeklyHours[today].open){open=true;until=1440-minute+weeklyHours[today].close}else if(!weeklyHours[prev].closed&&minute<weeklyHours[prev].close){open=true;until=weeklyHours[prev].close-minute}
cards.forEach(c=>{const isToday=Number(c.dataset.day)===today;c.classList.toggle('today',isToday);c.classList.toggle('closed-day',isToday&&!open);const b=c.querySelector('.status');b.className='status hidden-status';b.textContent='';if(!isToday)return;b.className='status';if(!open){b.classList.add('closed');b.textContent=words[lang].isClosed}else if(until<=60){b.classList.add('soon');b.textContent=`${words[lang].closing} ${formatTime(minute+until)}`}else b.textContent=words[lang].isOpen});mainStatus.classList.toggle('closed',!open);mainStatus.textContent=open?words[lang].open:words[lang].closed}
document.getElementById('language').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';renderLanguage()});renderLanguage();loadStoreHours();setInterval(updateStatus,30000);
})();</script></body></html>
